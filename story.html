<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="103班 · 103 纪事：全班一起写下我们的故事与历史">
  <title>103 纪事 · 103班 音乐领军班</title>
  <!-- 跨文档视图过渡:多页之间平滑切换,无白屏 -->
  <meta name="view-transition" content="same-origin">
  <!-- 手机浏览器地址栏颜色,nav.js 切换主题时会同步改 -->
  <meta name="theme-color" content="#070b14">
  <!-- 主题预置:必须在 CSS 之前执行,否则浅色用户刷新时会先闪一下深色 -->
  <script>
    try {
      if (localStorage.getItem("class103-theme") === "light") {
        document.documentElement.dataset.theme = "light";
        document.querySelector('meta[name="theme-color"]').content = "#f4f6fa";
      }
    } catch (e) {}
  </script>
  <!-- 全站字体 MiSans(小米官方 CDN,国内直连;中文+西文统一,跨设备渲染一致) -->
  <link rel="preconnect" href="https://font.sec.miui.com" crossorigin>
  <link rel="stylesheet" href="https://font.sec.miui.com/font/css?family=MiSans:300,400,500,700,900:Chinese_Simplify,Latin&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/story.css">
</head>
<body>
  <!-- 顶部导航栏由 assets/js/nav.js 动态注入 -->

  <section class="page-hero">
    <div class="no">Chronicle</div>
    <h1><span class="gold-text">103 纪事</span></h1>
    <p>全班一起，写下我们的故事</p>
  </section>

  <section class="section">
    <div class="container">
      <div class="story-wrap">

        <!-- ========== 写一条 ========== -->
        <form class="composer" id="composer" autocomplete="off">
          <p class="composer-title">写一条</p>

          <div class="composer-row">
            <label class="field">
              <span>你的名字</span>
              <input id="f-name" type="text" maxlength="24" placeholder="留空就署名「匿名同学」">
            </label>
            <label class="field">
              <span>删帖口令（4 位以上）</span>
              <input id="f-pass" type="text" maxlength="32" placeholder="自己记住，用来删自己的帖子">
            </label>
          </div>

          <label class="field">
            <span>正文</span>
            <textarea id="f-body" rows="5" maxlength="4000" placeholder="那天发生了什么？写下来，就是 103 的历史。"></textarea>
          </label>

          <div class="picker">
            <input id="f-file" type="file" accept="image/*" multiple hidden>
            <button class="pick-btn" type="button" id="pick-btn">＋ 加图片</button>
            <span class="pick-hint" id="pick-hint">最多 3 张，上传前自动压到 1MB 以内</span>
            <div class="thumbs" id="thumbs"></div>
          </div>

          <div class="composer-foot">
            <p class="form-msg" id="form-msg"></p>
            <button class="submit-btn" type="submit" id="submit-btn">发布</button>
          </div>
        </form>

        <!-- ========== 大家都在写 ========== -->
        <div class="story-list" id="story-list"></div>

        <div class="pager" id="pager" hidden>
          <button type="button" id="prev-btn">‹ 更新的</button>
          <span id="page-info"></span>
          <button type="button" id="next-btn">更早的 ›</button>
        </div>

        <div class="thanks">
          <p class="thanks-title">鸣谢</p>
          <p class="credit">小柏制作 · 方胤锐发行</p>
        </div>

      </div>
    </div>
  </section>

  <!-- 点图看大图 -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <img id="lightbox-img" alt="">
  </div>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/story.js"></script>
</body>
</html>
