<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="103班 · 同窗：同学录、宿舍与活跃榜">
  <title>同窗 · 103班 音乐领军班</title>
  <!-- 跨文档视图过渡:多页之间平滑切换,无白屏 -->
  <meta name="view-transition" content="same-origin">
  <!-- 手机浏览器地址栏颜色,nav.js 切换主题时会同步改 -->
  <meta name="theme-color" content="#070b14">
  <!-- 主题预置:必须在 CSS 之前执行,否则浅色用户刷新时会先闪一下深色 -->
  <script>
    try {
      if (localStorage.getItem("class103-theme") === "light") {
        document.documentElement.dataset.theme = "light";
        document.querySelector('meta[name="theme-color"]').content = "#f4f6fa";
      }
      // 皮肤预置:同样要在 CSS 之前,避免刷新时先闪一下默认金色
      var sk = localStorage.getItem("class103-skin");
      if (sk && sk !== "classic") document.documentElement.dataset.skin = sk;
    } catch (e) {}
  </script>
  <!-- 全站字体 MiSans(小米官方 CDN,国内直连;中文+西文统一,跨设备渲染一致) -->
  <link rel="preconnect" href="https://font.sec.miui.com" crossorigin>
  <link rel="stylesheet" href="https://font.sec.miui.com/font/css?family=MiSans:300,400,500,700,900:Chinese_Simplify,Latin&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/students.css">
  <link rel="stylesheet" href="assets/css/dormitory.css">
  <link rel="stylesheet" href="assets/css/rank.css">
</head>
<body>
  <!-- 顶部导航栏由 assets/js/nav.js 动态注入 -->

  <section class="page-hero">
    <div class="no">Cast</div>
    <h1><span class="gold-text">同窗</span></h1>
    <p>每个座位,都是一颗待发光的主唱</p>
  </section>

  <!-- ========== 同学录:已实名账号名单(由 students.js 接管) ========== -->
  <section class="section">
    <div class="container">
      <div id="students-grid" class="students-grid">
        <!-- 学生卡片由 assets/js/students.js 渲染 -->
      </div>
    </div>
  </section>

  <!-- ========== 宿舍风采:原 dormitory.html 并入(由 dormitory.js 接管) ========== -->
  <section class="section" id="dorm">
    <div class="container">
      <div class="media-head">
        <h2>宿舍风采</h2>
        <p>每一间宿舍,都是一间小型录音棚</p>
      </div>
      <div id="dorm-grid" class="dorm-grid">
        <!-- 宿舍卡片由 assets/js/dormitory.js 渲染 -->
      </div>
    </div>
  </section>

  <!-- ========== 班级活跃榜:原 rank.html 并入(数据来自 GET /api/rank) ========== -->
  <section class="section" id="rank">
    <div class="container">
      <div class="media-head">
        <h2>班级活跃榜</h2>
        <p>谁在认真写,谁的帖子最热闹</p>
      </div>
      <div class="rk-stats" id="rk-stats"></div>
      <div class="rk-grid" id="rk-grid">
        <p class="rk-empty">正在统计…</p>
      </div>

      <div class="thanks">
        <p class="thanks-title">鸣谢</p>
        <p class="credit">小柏制作</p>
      </div>
    </div>
  </section>

  <!-- 灯箱:点击照片查看完整原图(不裁切),可左右翻看 -->
  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">×</span>
    <span class="nav prev" id="lightbox-prev" hidden>‹</span>
    <span class="nav next" id="lightbox-next" hidden>›</span>
    <div>
      <img id="lightbox-img" src="" alt="宿舍照片">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
    <div class="counter" id="lightbox-counter"></div>
  </div>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/students.js"></script>
  <script src="assets/js/dormitory.js"></script>
  <script>
    // 未实名 / 未注册的访客:同窗里只留同学录和活跃榜,
    //「宿舍风采」整块和对应的子导航药丸藏掉(首页的宿舍预览不受影响)
    (function () {
      var A = window.C103Auth;
      var r = A && (A.ready || A.refresh());
      (r || Promise.resolve()).then(function () {
        if (!A || A.canViewSections()) return;
        var dorm = document.getElementById("dorm");
        if (dorm) dorm.hidden = true;
        document.querySelectorAll('.subnav a').forEach(function (a) {
          if ((a.getAttribute("href") || "").indexOf("#dorm") >= 0) a.hidden = true;
        });
      });
    })();
  </script>
  <script>
    // 活跃榜:全部数据来自 GET /api/rank,不发任何写请求(原 rank.html 内联脚本)
    document.addEventListener("DOMContentLoaded", () => {
      const statsBox = document.getElementById("rk-stats");
      const gridBox = document.getElementById("rk-grid");
      if (!statsBox || !gridBox) return;

      const esc = (s) =>
        String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );
      const API = "api";
      const ROLE_LABEL = { owner: "服主", admin: "管理员" };

      const face = (p, cls) =>
        p.avatar
          ? `<img class="${cls}" src="${API}/img/${esc(p.avatar)}" alt="" loading="lazy">`
          : `<span class="${cls}">${esc((window.C103Person.name(p) || "?").slice(0, 1))}</span>`;

      // 有官方认证头衔时头衔药丸优先(名字后面 C103Person.html 已带),管理员药丸让位不显示
      const roleTag = (p) =>
        p.role === "owner" || (p.role === "admin" && !String(p.cert_title || "").trim())
          ? `<em class="${esc(p.role)}">${ROLE_LABEL[p.role]}</em>`
          : "";

      function rows(list, unit) {
        if (!list.length) return '<p class="rk-empty">还没有人上榜，第一个就是你。</p>';
        return list
          .map(
            (p, i) => `<a class="rk-row${i < 3 ? " top" + (i + 1) : ""}" href="u.html?id=${p.id}">
              <span class="rk-no">${i + 1}</span>
              ${face(p, "rk-face")}
              <span class="rk-name">${window.C103Person.html(p)}${roleTag(p)}</span>
              <span class="rk-n">${p.n === undefined ? "" : p.n + unit}</span>
            </a>`
          )
          .join("");
      }

      function hot(list) {
        if (!list.length) return '<p class="rk-empty">还没有热闹起来的帖子。</p>';
        return list
          .map(
            (h) => `<a class="rk-hot-row" href="story.html">
              <span class="rk-hot-body">
                ${window.C103Person.html(h)}：${esc(h.excerpt) || "（图片）"}
                <span class="rk-hot-meta">${new Date(h.created_at).toLocaleDateString("zh-CN")}</span>
              </span>
              <span class="rk-hot-n">${h.replies} 条回复</span>
            </a>`
          )
          .join("");
      }

      function paint(d) {
        const t = d.totals || {};
        statsBox.innerHTML = `
          <div class="rk-stat"><b>${t.members || 0}</b><span>班内成员</span></div>
          <div class="rk-stat"><b>${t.posts || 0}</b><span>主帖</span></div>
          <div class="rk-stat"><b>${t.replies || 0}</b><span>回复</span></div>
          <div class="rk-stat"><b>${t.likes || 0}</b><span>点赞</span></div>`;

        gridBox.innerHTML = `
          <div class="rk-card">
            <h3>发帖榜</h3><p class="rk-sub">谁写下的主帖最多</p>
            ${rows(d.posters || [], " 帖")}
          </div>
          <div class="rk-card">
            <h3>人气榜</h3><p class="rk-sub">谁的主页被点赞最多</p>
            ${rows(d.liked || [], " 赞")}
          </div>
          <div class="rk-card">
            <h3>人缘榜</h3><p class="rk-sub">谁的主页留言最多</p>
            ${rows(d.walled || [], " 条")}
          </div>
          <div class="rk-card rk-hot">
            <h3>最热闹的帖子</h3><p class="rk-sub">回复最多的主帖，点进去接着聊</p>
            ${hot(d.hot || [])}
          </div>`;
      }

      fetch(API + "/rank", { credentials: "same-origin" })
        .then((r) => r.json().then((d) => ({ ok: r.ok, d: d })))
        .then(({ ok, d }) => {
          if (!ok || !d.ok) throw new Error((d && d.error) || "读不到榜单");
          paint(d);
        })
        .catch((err) => {
          gridBox.innerHTML = '<p class="rk-empty">' + esc(err.message) + "</p>";
        });
    });
  </script>
</body>
</html>
