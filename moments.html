<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="103班 · 高光时刻">
  <title>高光时刻 · 103班 音乐领军班</title>
  <!-- 跨文档视图过渡:多页之间平滑切换,无白屏 -->
  <meta name="view-transition" content="same-origin">
  <!-- 手机浏览器地址栏颜色,nav.js 切换主题时会同步改 -->
  <meta name="theme-color" content="#070b14">
  <!-- 主题预置:必须在 CSS 之前执行,否则浅色用户刷新时会先闪一下深色 -->
  <script>
    try {
      if (localStorage.getItem("class103-theme") === "light") {
        document.documentElement.dataset.theme = "light";
        document.querySelector('meta[name="theme-color"]').content = "#f4f6fa";
      }
      // 皮肤预置:同样要在 CSS 之前,避免刷新时先闪一下默认金色
      var sk = localStorage.getItem("class103-skin");
      if (sk && sk !== "classic") document.documentElement.dataset.skin = sk;
    } catch (e) {}
  </script>
  <!-- 全站字体 MiSans(小米官方 CDN,国内直连;中文+西文统一,跨设备渲染一致) -->
  <link rel="preconnect" href="https://font.sec.miui.com" crossorigin>
  <link rel="stylesheet" href="https://font.sec.miui.com/font/css?family=MiSans:300,400,500,700,900:Chinese_Simplify,Latin&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/moments.css">
</head>
<body>
  <!-- 顶部导航栏由 assets/js/nav.js 动态注入 -->

  <section class="page-hero">
    <div class="no">Highlights</div>
    <h1><span class="gold-text">高光时刻</span></h1>
    <p>那些定格在旋律里的瞬间</p>
  </section>

  <section class="section">
    <div class="container">
      <!-- 照片分组来自后台「高光时刻」,这里只放第一个分组的容器 -->
      <div class="group-head" id="moments-first-head" hidden>
        <span class="en" id="moments-first-en"></span>
        <h2 id="moments-first-title"></h2>
      </div>
      <div id="moments-grid" class="moments-grid"></div>
      <p class="moments-empty" id="moments-empty" hidden>高光时刻还没录入，去「管理后台 → 高光时刻」加一组。</p>
    </div>
  </section>

  <!-- 活动视频:来自后台,没有视频时整块隐藏 -->
  <section class="section" id="moments-video-section" hidden>
    <div class="container">
      <div class="video-block">
        <div class="group-head">
          <span class="en">Feature</span>
          <h2>活动视频</h2>
        </div>
        <div class="video-list"></div>
      </div>
    </div>
  </section>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">×</span>
    <div>
      <img id="lightbox-img" src="" alt="放大查看">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <script src="assets/js/nav.js"></script>
  <script>
    // 高光时刻:照片分组与视频全部来自后台(GET /api/content 的 moments),
    // 接口没有数据就显示空态,不再保留写死内容。
    document.addEventListener("DOMContentLoaded", () => {
      // 来自接口的文本 / 图片地址统一处理(图片地址必须过 C103Img)
      const esc = (s) =>
        String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );
      const img = window.C103Img || ((v) => v);

      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightbox-img");
      const lightboxCaption = document.getElementById("lightbox-caption");
      const closeBtn = document.getElementById("lightbox-close");

      function closeLightbox() {
        lightbox.classList.remove("show");
      }
      closeBtn.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });

      // 一张照片的相框;caption 为空时 alt 用分组标题,figcaption 省略
      const figure = (photo, title) => {
        const caption = photo && photo.caption ? String(photo.caption) : "";
        const cap = caption ? `<figcaption>${esc(caption)}</figcaption>` : "";
        return `
        <figure class="moment-item">
          <img src="${esc(img(photo && photo.src))}" alt="${esc(caption || title || "")}">
          ${cap}
        </figure>`;
      };

      // 点击放大(灯箱):渲染完成后统一绑定
      const bindLightbox = () => {
        document.querySelectorAll(".moment-item").forEach((item) => {
          item.addEventListener("click", () => {
            const image = item.querySelector("img");
            const cap = item.querySelector("figcaption");
            lightboxImg.src = image.src;
            lightboxCaption.textContent = cap ? cap.textContent : "";
            lightbox.classList.add("show");
          });
        });
      };

      const grid = document.getElementById("moments-grid");
      const firstHead = document.getElementById("moments-first-head");
      const firstEn = document.getElementById("moments-first-en");
      const firstTitle = document.getElementById("moments-first-title");
      const emptyTip = document.getElementById("moments-empty");
      const mainSection = grid ? grid.closest("section") : null;
      const videoSection = document.getElementById("moments-video-section");
      const videoList = videoSection ? videoSection.querySelector(".video-list") : null;

      // 清掉上一次渲染出来的动态分组(避免 onChange 二次触发时叠加)
      const clearDynamicGroups = () => {
        document.querySelectorAll("[data-moments-dyn]").forEach((n) => n.remove());
      };

      const render = (moments) => {
        clearDynamicGroups();
        const groups = moments && Array.isArray(moments.groups) ? moments.groups : [];

        if (!groups.length) {
          // 没有任何分组:空态,隐藏第一组标题
          if (grid) grid.innerHTML = "";
          if (firstHead) firstHead.hidden = true;
          if (emptyTip) emptyTip.hidden = false;
        } else {
          if (emptyTip) emptyTip.hidden = true;

          // 第 1 组 → 照片墙,配上分组标题
          const first = groups[0] || {};
          const firstPhotos = Array.isArray(first.photos) ? first.photos : [];
          if (firstHead) {
            firstHead.hidden = false;
            if (firstEn) firstEn.textContent = first.en || "";
            if (firstTitle) firstTitle.textContent = first.title || "";
          }
          if (grid) {
            grid.innerHTML = firstPhotos.map((p) => figure(p, first.title)).join("");
          }

          // 第 2 组及以后:每组一个 section,插在第一块之后
          if (mainSection) {
            let anchor = mainSection;
            groups.slice(1).forEach((g) => {
              const photos = Array.isArray(g.photos) ? g.photos : [];
              if (!photos.length) return;
              const section = document.createElement("section");
              section.className = "section";
              section.setAttribute("data-moments-dyn", "");
              section.innerHTML = `
              <div class="container">
                <div class="group-head">
                  <span class="en">${esc(g.en || "")}</span>
                  <h2>${esc(g.title || "")}</h2>
                </div>
                <div class="bridge-grid">${photos.map((p) => figure(p, g.title)).join("")}</div>
              </div>`;
              anchor.after(section);
              anchor = section;
            });
          }
        }

        // 视频:后台有就渲染,没有就整块隐藏
        const videos = moments && Array.isArray(moments.videos) ? moments.videos : [];
        if (videoSection && videoList) {
          if (videos.length) {
            videoList.innerHTML = videos
              .map(
                (v) => `
            <figure class="video-item">
              <video controls preload="metadata" playsinline>
                <source src="${esc(img(v && v.src))}" type="video/mp4">
                你的浏览器不支持视频播放。
              </video>
              <figcaption class="video-note">${esc((v && v.caption) || "")}</figcaption>
            </figure>`
              )
              .join("");
            videoSection.hidden = false;
          } else {
            videoList.innerHTML = "";
            videoSection.hidden = true;
          }
        }
      };

      if (window.C103Content) {
        C103Content.load().then((content) => {
          render(content && content.moments);
          bindLightbox();
        });
        // 后台改了别的内容(比如换个分组标题)时,这里同步刷新
        if (window.C103Content.onChange) {
          window.C103Content.onChange((content) => {
            if (!content) return;
            render(content.moments);
            bindLightbox();
          });
        }
      }
    });
  </script>
</body>
</html>
