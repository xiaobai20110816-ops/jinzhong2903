<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="103班 · 高光时刻">
  <title>高光时刻 · 103班 音乐领军班</title>
  <!-- 跨文档视图过渡:多页之间平滑切换,无白屏 -->
  <meta name="view-transition" content="same-origin">
  <!-- 手机浏览器地址栏颜色,nav.js 切换主题时会同步改 -->
  <meta name="theme-color" content="#070b14">
  <!-- 主题预置:必须在 CSS 之前执行,否则浅色用户刷新时会先闪一下深色 -->
  <script>
    try {
      if (localStorage.getItem("class103-theme") === "light") {
        document.documentElement.dataset.theme = "light";
        document.querySelector('meta[name="theme-color"]').content = "#f4f6fa";
      }
      // 皮肤预置:同样要在 CSS 之前,避免刷新时先闪一下默认金色
      var sk = localStorage.getItem("class103-skin");
      if (sk && sk !== "classic") document.documentElement.dataset.skin = sk;
    } catch (e) {}
  </script>
  <!-- 全站字体 MiSans(小米官方 CDN,国内直连;中文+西文统一,跨设备渲染一致) -->
  <link rel="preconnect" href="https://font.sec.miui.com" crossorigin>
  <link rel="stylesheet" href="https://font.sec.miui.com/font/css?family=MiSans:300,400,500,700,900:Chinese_Simplify,Latin&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/moments.css">
</head>
<body>
  <!-- 顶部导航栏由 assets/js/nav.js 动态注入 -->

  <section class="page-hero">
    <div class="no">Highlights</div>
    <h1><span class="gold-text">高光时刻</span></h1>
    <p>那些定格在旋律里的瞬间</p>
  </section>

  <section class="section">
    <div class="container">
      <!-- 照片墙:图片放在 assets/images/albums/ 里,新增照片照下面格式加一段 figure 即可 -->
      <div id="moments-grid" class="moments-grid">
        <figure class="moment-item">
          <img src="assets/images/albums/choir-01.jpg" alt="合唱比赛 01">
          <figcaption>合唱比赛 · 01</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-02.jpg" alt="合唱比赛 02">
          <figcaption>合唱比赛 · 02</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-03.jpg" alt="合唱比赛 03">
          <figcaption>合唱比赛 · 03</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-04.jpg" alt="合唱比赛 04">
          <figcaption>合唱比赛 · 04</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-05.jpg" alt="合唱比赛 05">
          <figcaption>合唱比赛 · 05</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-06.jpg" alt="合唱比赛 06">
          <figcaption>合唱比赛 · 06</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-07.jpg" alt="合唱比赛 07">
          <figcaption>合唱比赛 · 07</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-08.jpg" alt="合唱比赛 08">
          <figcaption>合唱比赛 · 08</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-09.jpg" alt="合唱比赛 09">
          <figcaption>合唱比赛 · 09</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-10.jpg" alt="合唱比赛 10">
          <figcaption>合唱比赛 · 10</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-11.jpg" alt="合唱比赛 11">
          <figcaption>合唱比赛 · 11</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-12.jpg" alt="合唱比赛 12">
          <figcaption>合唱比赛 · 12</figcaption>
        </figure>
        <figure class="moment-item">
          <img src="assets/images/albums/choir-13.jpg" alt="合唱比赛 13">
          <figcaption>合唱比赛 · 13</figcaption>
        </figure>
      </div>
    </div>
  </section>

  <!-- 天桥文化:目前只有一张,以后加图直接往 .bridge-grid 里接着放一段 figure 即可 -->
  <section class="section">
    <div class="container">
      <div class="group-head">
        <span class="en">Overpass</span>
        <h2>天桥文化</h2>
      </div>
      <div class="bridge-grid">
        <figure class="moment-item">
          <img src="assets/images/albums/bridge-01.jpg" alt="天桥文化 01">
          <figcaption>天桥文化 · 01</figcaption>
        </figure>
      </div>
    </div>
  </section>

  <!-- 活动视频:宿舍大合唱 -->
  <section class="section">
    <div class="container">
      <div class="video-block">
        <div class="group-head">
          <span class="en">Feature</span>
          <h2>宿舍大合唱</h2>
        </div>
        <div class="video-list">
          <figure class="video-item">
            <video controls preload="metadata" playsinline>
              <source src="assets/videos/parade.mp4" type="video/mp4">
              你的浏览器不支持视频播放。
            </video>
            <figcaption class="video-note">片段一 · 时长 04:31</figcaption>
          </figure>
          <figure class="video-item">
            <video controls preload="metadata" playsinline>
              <source src="assets/videos/parade-2.mp4" type="video/mp4">
              你的浏览器不支持视频播放。
            </video>
            <figcaption class="video-note">片段二 · 时长 00:30</figcaption>
          </figure>
        </div>
      </div>
    </div>
  </section>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">×</span>
    <div>
      <img id="lightbox-img" src="" alt="放大查看">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <script src="assets/js/nav.js"></script>
  <script>
    // 高光时刻:照片分组与视频来自后台(GET /api/content 的 moments)
    // 分组、图、视频都在渲染完成后再统一绑一次灯箱;拿不到内容就保留写死的三块
    document.addEventListener("DOMContentLoaded", () => {
      // 来自接口的文本 / 图片地址统一处理(图片地址必须过 C103Img)
      const esc = (s) =>
        String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );
      const img = window.C103Img || ((v) => v);

      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightbox-img");
      const lightboxCaption = document.getElementById("lightbox-caption");
      const closeBtn = document.getElementById("lightbox-close");

      function closeLightbox() {
        lightbox.classList.remove("show");
      }
      closeBtn.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });

      // 一张照片的相框;caption 为空时 alt 用分组标题,figcaption 省略
      const figure = (photo, title) => {
        const caption = photo && photo.caption ? String(photo.caption) : "";
        const cap = caption ? `<figcaption>${esc(caption)}</figcaption>` : "";
        return `
        <figure class="moment-item">
          <img src="${esc(img(photo && photo.src))}" alt="${esc(caption || title || "")}">
          ${cap}
        </figure>`;
      };

      // 点击放大(灯箱):渲染完成 / 兜底内容都要能用,统一在这里绑定
      const bindLightbox = () => {
        document.querySelectorAll(".moment-item").forEach((item) => {
          item.addEventListener("click", () => {
            const image = item.querySelector("img");
            const cap = item.querySelector("figcaption");
            lightboxImg.src = image.src;
            lightboxCaption.textContent = cap ? cap.textContent : "";
            lightbox.classList.add("show");
          });
        });
      };

      const grid = document.getElementById("moments-grid");
      const mainSection = grid ? grid.closest("section") : null;
      const fallbackBridge = document.querySelector(".bridge-grid")
        ? document.querySelector(".bridge-grid").closest("section")
        : null;

      const render = (moments) => {
        // 加载失败 / 没有分组:保留写死的三块
        if (!moments || !Array.isArray(moments.groups) || !moments.groups.length) return;

        // 第 1 组 → 现有照片墙(没有图就沿用写死的 13 张)
        const first = moments.groups[0] || {};
        const firstPhotos = Array.isArray(first.photos) ? first.photos : [];
        if (grid && firstPhotos.length) {
          grid.innerHTML = firstPhotos.map((p) => figure(p, first.title)).join("");
        }

        // 第 2 组及以后:每组一个 group-head + bridge-grid,插在第一块 section 之后
        if (fallbackBridge) fallbackBridge.remove();
        if (mainSection) {
          let anchor = mainSection;
          moments.groups.slice(1).forEach((g) => {
            const photos = Array.isArray(g.photos) ? g.photos : [];
            if (!photos.length) return;
            const section = document.createElement("section");
            section.className = "section";
            section.innerHTML = `
            <div class="container">
              <div class="group-head">
                <span class="en">${esc(g.en || "")}</span>
                <h2>${esc(g.title || "")}</h2>
              </div>
              <div class="bridge-grid">${photos.map((p) => figure(p, g.title)).join("")}</div>
            </div>`;
            anchor.after(section);
            anchor = section;
          });
        }

        // 视频:后台有就清空重建,没有就保留写死的两个
        const videos = Array.isArray(moments.videos) ? moments.videos : [];
        const videoList = document.querySelector(".video-list");
        if (videoList && videos.length) {
          videoList.innerHTML = videos
            .map(
              (v) => `
          <figure class="video-item">
            <video controls preload="metadata" playsinline>
              <source src="${esc(img(v && v.src))}" type="video/mp4">
              你的浏览器不支持视频播放。
            </video>
            <figcaption class="video-note">${esc((v && v.caption) || "")}</figcaption>
          </figure>`
            )
            .join("");
        }
      };

      if (window.C103Content) {
        // load() 失败时 resolve 出 null,此时保留写死内容,但灯箱照常绑定
        C103Content.load().then((content) => {
          if (content) render(content.moments);
          bindLightbox();
        });
      } else {
        bindLightbox();
      }
    });
  </script>
</body>
</html>
