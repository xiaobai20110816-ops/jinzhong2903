<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="103班 · 班级公告">
  <title>班级公告 · 103班 音乐领军班</title>
  <!-- 跨文档视图过渡:多页之间平滑切换,无白屏 -->
  <meta name="view-transition" content="same-origin">
  <!-- 手机浏览器地址栏颜色,nav.js 切换主题时会同步改 -->
  <meta name="theme-color" content="#070b14">
  <!-- 主题预置:必须在 CSS 之前执行,否则浅色用户刷新时会先闪一下深色 -->
  <script>
    try {
      if (localStorage.getItem("class103-theme") === "light") {
        document.documentElement.dataset.theme = "light";
        document.querySelector('meta[name="theme-color"]').content = "#f4f6fa";
      }
      // 皮肤预置:同样要在 CSS 之前,避免刷新时先闪一下默认金色
      var sk = localStorage.getItem("class103-skin");
      if (sk && sk !== "classic") document.documentElement.dataset.skin = sk;
    } catch (e) {}
  </script>
  <!-- 全站字体 MiSans(小米官方 CDN,国内直连;中文+西文统一,跨设备渲染一致) -->
  <link rel="preconnect" href="https://font.sec.miui.com" crossorigin>
  <link rel="stylesheet" href="https://font.sec.miui.com/font/css?family=MiSans:300,400,500,700,900:Chinese_Simplify,Latin&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <style>
    /* 公告页时间线样式 */
    .timeline { position: relative; max-width: 760px; margin: 0 auto; padding-left: 30px; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--gold), var(--gold-2), transparent);
    }
    .tl-item { position: relative; margin-bottom: 30px; }
    .tl-item::before {
      content: "";
      position: absolute;
      left: -30px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bg0);
      border: 3px solid var(--gold);
    }
    .tl-date {
      font-family: var(--font-display);
      letter-spacing: 2px;
      color: var(--gold-2);
      font-size: 0.9rem;
    }
    .tl-body {
      background: var(--glass-surface);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid var(--glass-brd);
      box-shadow: var(--glass-rim);
      border-radius: 16px;
      padding: 18px 22px;
      margin-top: 8px;
      transition: background-color 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
    }
    .tl-body h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .tl-body p { color: var(--muted); font-size: 0.92rem; }

    /* 正文里的 Markdown 元素(标题 / 列表 / 引用 / 代码 / 链接 / 分割线) */
    .tl-body h4, .tl-body h5, .tl-body h6 {
      font-size: 0.98rem;
      margin: 12px 0 5px;
      color: var(--text);
      transition: color 0.6s ease;
    }
    .tl-body ul, .tl-body ol {
      margin: 6px 0 6px 22px;
      color: var(--muted);
      font-size: 0.92rem;
      transition: color 0.6s ease;
    }
    .tl-body li { margin: 3px 0; }
    .tl-body strong { color: var(--text); transition: color 0.6s ease; }
    .tl-body blockquote {
      margin: 9px 0;
      padding: 7px 14px;
      border-left: 3px solid var(--gold-line);
      border-radius: 0 10px 10px 0;
      background: var(--gold-soft);
      color: var(--muted);
      font-size: 0.9rem;
      transition: color 0.6s ease, background-color 0.6s ease, border-color 0.6s ease;
    }
    .tl-body code {
      font-family: ui-monospace, Consolas, "Courier New", monospace;
      font-size: 0.86em;
      padding: 1px 6px;
      border-radius: 6px;
      background: var(--chip);
      border: 1px solid var(--line);
      transition: background-color 0.6s ease, border-color 0.6s ease;
    }
    .tl-body pre {
      margin: 9px 0;
      padding: 12px 14px;
      border-radius: 12px;
      overflow-x: auto;
      background: var(--chip);
      border: 1px solid var(--line);
      transition: background-color 0.6s ease, border-color 0.6s ease;
    }
    .tl-body pre code { padding: 0; border: none; background: none; }
    .tl-body a {
      color: var(--gold);
      border-bottom: 1px solid var(--gold-line);
      transition: color 0.6s ease, border-color 0.6s ease;
    }
    .tl-body hr {
      margin: 14px 0;
      border: none;
      border-top: 1px solid var(--line);
      transition: border-color 0.6s ease;
    }
    .tl-body img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 10px 0;
      border-radius: 12px;
      border: 1px solid var(--line);
      transition: border-color 0.6s ease;
    }

    /* 置顶公告:金色描边突出 */
    .tl-item.pinned .tl-body {
      border-color: var(--gold-line);
    }
    .tl-pin {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 9px;
      border-radius: 999px;
      background: var(--gold);
      color: #0b0f1a;
      font-size: 0.68rem;
      letter-spacing: 1px;
      vertical-align: middle;
    }

    /* 鸣谢 */
    .thanks { text-align: center; margin-top: 34px; }
    .thanks-title {
      font-family: var(--font-display);
      font-size: 0.9rem;
      letter-spacing: 8px;
      text-indent: 8px;
      color: var(--gold);
    }
    .thanks-title::before,
    .thanks-title::after {
      content: "";
      display: inline-block;
      width: 42px;
      height: 1px;
      background: var(--gold-line);
      vertical-align: middle;
      margin: 0 14px;
    }
    /* 最底部小字:不张扬 */
    .credit {
      margin-top: 18px;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: var(--muted);
      opacity: 0.42;
    }

    /* 没有公告时的空态 */
    .tl-empty {
      text-align: center;
      padding: 46px 20px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏由 assets/js/nav.js 动态注入 -->

  <section class="page-hero">
    <div class="no">News</div>
    <h1><span class="gold-text">班级公告</span></h1>
    <p>我们的每一次集结令</p>
  </section>

  <section class="section">
    <div class="container">
      <div class="timeline">
        <!-- 公告全部来自后台「管理后台 → 班级公告」,这里只放读取中的占位 -->
        <p class="tl-empty">正在读取公告…</p>
      </div>

      <!-- 鸣谢:最底下一行小字,不张扬 -->
      <div class="thanks">
        <p class="thanks-title">鸣谢</p>
        <p class="credit">小柏制作</p>
      </div>
    </div>
  </section>

  <script src="assets/js/nav.js"></script>
  <script>
    // 班级公告:时间线与鸣谢都来自后台(GET /api/content)
    // 拿不到内容时不动 DOM,保留上面写死的三段公告与「鸣谢 / 小柏制作」
    document.addEventListener("DOMContentLoaded", () => {
      const timeline = document.querySelector(".timeline");
      if (!timeline) return;

      // 来自接口的文本统一转义后再拼进 innerHTML
      const esc = (s) =>
        String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );

      // 鸣谢:后台改了全站跟着变,拿不到就用页面里写死的
      const thanksTitle = document.querySelector(".thanks-title");
      const credit = document.querySelector(".credit");
      const renderThanks = (site) => {
        if (!site) return;
        if (thanksTitle && site.thanksTitle) thanksTitle.textContent = site.thanksTitle;
        if (credit && site.thanksName) credit.textContent = site.thanksName;
      };

      const render = (list) => {
        const items = Array.isArray(list) ? list : [];
        // 没有公告 / 读不到:显示空态,不再退回任何写死内容
        if (!items.length) {
          timeline.innerHTML =
            '<p class="tl-empty">还没有公告。班级公告由服主 / 管理员在「管理后台 → 班级公告」发布。</p>';
          return;
        }

        // 置顶的排前面,其余保持后台数组顺序
        const sorted = items.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

        timeline.innerHTML = sorted
          .map((a) => {
            // 正文按 Markdown 渲染(后台怎么写就怎么显示);渲染器没加载时退回纯文本段落
            const body = window.C103Markdown
              ? window.C103Markdown.render(a.body)
              : String(a.body || "")
                  .split("\n")
                  .map((t) => t.trim())
                  .filter(Boolean)
                  .map((t) => `<p>${esc(t)}</p>`)
                  .join("");
            const title = a.title ? `<h3>${esc(a.title)}</h3>` : "";
            const pin = a.pinned ? `<span class="tl-pin">置顶</span>` : "";
            return `
        <div class="tl-item${a.pinned ? " pinned" : ""}">
          <div class="tl-date">${esc(a.date)}${pin}</div>
          <div class="tl-body">${title}${body}</div>
        </div>`;
          })
          .join("");
      };

      if (!window.C103Content) return;
      // 读不到内容(返回 null)也照样走空态,不保留任何写死公告
      C103Content.load().then((content) => {
        renderThanks(content && content.site);
        render(content && content.announcements);
      });
    });
  </script>
</body>
</html>
