<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="103班 · 班级公告">
  <title>班级公告 · 103班 音乐领军班</title>
  <!-- 跨文档视图过渡:多页之间平滑切换,无白屏 -->
  <meta name="view-transition" content="same-origin">
  <!-- 手机浏览器地址栏颜色,nav.js 切换主题时会同步改 -->
  <meta name="theme-color" content="#070b14">
  <!-- 主题预置:必须在 CSS 之前执行,否则浅色用户刷新时会先闪一下深色 -->
  <script>
    try {
      if (localStorage.getItem("class103-theme") === "light") {
        document.documentElement.dataset.theme = "light";
        document.querySelector('meta[name="theme-color"]').content = "#f4f6fa";
      }
    } catch (e) {}
  </script>
  <!-- 全站字体 MiSans(小米官方 CDN,国内直连;中文+西文统一,跨设备渲染一致) -->
  <link rel="preconnect" href="https://font.sec.miui.com" crossorigin>
  <link rel="stylesheet" href="https://font.sec.miui.com/font/css?family=MiSans:300,400,500,700,900:Chinese_Simplify,Latin&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <style>
    /* 公告页时间线样式 */
    .timeline { position: relative; max-width: 760px; margin: 0 auto; padding-left: 30px; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--gold), var(--gold-2), transparent);
    }
    .tl-item { position: relative; margin-bottom: 30px; }
    .tl-item::before {
      content: "";
      position: absolute;
      left: -30px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bg0);
      border: 3px solid var(--gold);
    }
    .tl-date {
      font-family: var(--font-display);
      letter-spacing: 2px;
      color: var(--gold-2);
      font-size: 0.9rem;
    }
    .tl-body {
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-brd);
      box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-shadow);
      border-radius: 16px;
      padding: 18px 22px;
      margin-top: 8px;
    }
    .tl-body h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .tl-body p { color: var(--muted); font-size: 0.92rem; }

    /* 置顶公告:金色描边突出 */
    .tl-item.pinned .tl-body {
      border-color: var(--gold-line);
    }
    .tl-pin {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 9px;
      border-radius: 999px;
      background: var(--gold);
      color: #0b0f1a;
      font-size: 0.68rem;
      letter-spacing: 1px;
      vertical-align: middle;
    }

    /* 鸣谢 */
    .thanks { text-align: center; margin-top: 34px; }
    .thanks-title {
      font-family: var(--font-display);
      font-size: 0.9rem;
      letter-spacing: 8px;
      text-indent: 8px;
      color: var(--gold);
    }
    .thanks-title::before,
    .thanks-title::after {
      content: "";
      display: inline-block;
      width: 42px;
      height: 1px;
      background: var(--gold-line);
      vertical-align: middle;
      margin: 0 14px;
    }
    /* 最底部小字:不张扬 */
    .credit {
      margin-top: 18px;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: var(--muted);
      opacity: 0.42;
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏由 assets/js/nav.js 动态注入 -->

  <section class="page-hero">
    <div class="no">News</div>
    <h1><span class="gold-text">班级公告</span></h1>
    <p>我们的每一次集结令</p>
  </section>

  <section class="section">
    <div class="container">
      <div class="timeline">
        <!-- 置顶公告 -->
        <div class="tl-item pinned">
          <div class="tl-date">2026.09.29<span class="tl-pin">置顶</span></div>
          <div class="tl-body">
            <p>合唱比赛获得 96.95 分,位列第一。</p>
          </div>
        </div>
        <div class="tl-item">
          <div class="tl-date">2026.09.25</div>
          <div class="tl-body">
            <p>素养 103 第二帝国建立,何易航政府覆灭,金楚涵皈依第二帝国。</p>
          </div>
        </div>
      </div>

      <!-- 鸣谢:最底下一行小字,不张扬 -->
      <div class="thanks">
        <p class="thanks-title">鸣谢</p>
        <p class="credit">小柏制作 · 方胤锐发行</p>
      </div>
    </div>
  </section>

  <script src="assets/js/nav.js"></script>
</body>
</html>
