<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="103班 · 照片与视频">
  <title>照片 · 视频 · 103班 音乐领军班</title>
  <!-- 跨文档视图过渡:多页之间平滑切换,无白屏 -->
  <meta name="view-transition" content="same-origin">
  <!-- 手机浏览器地址栏颜色,nav.js 切换主题时会同步改 -->
  <meta name="theme-color" content="#070b14">
  <!-- 主题预置:必须在 CSS 之前执行,否则浅色用户刷新时会先闪一下深色 -->
  <script>
    try {
      if (localStorage.getItem("class103-theme") === "light") {
        document.documentElement.dataset.theme = "light";
        document.querySelector('meta[name="theme-color"]').content = "#f4f6fa";
      }
      // 皮肤预置:同样要在 CSS 之前,避免刷新时先闪一下默认金色
      var sk = localStorage.getItem("class103-skin");
      if (sk && sk !== "classic") document.documentElement.dataset.skin = sk;
    } catch (e) {}
  </script>
  <!-- 全站字体 MiSans(小米官方 CDN,国内直连;中文+西文统一,跨设备渲染一致) -->
  <link rel="preconnect" href="https://font.sec.miui.com" crossorigin>
  <link rel="stylesheet" href="https://font.sec.miui.com/font/css?family=MiSans:300,400,500,700,900:Chinese_Simplify,Latin&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/gallery.css">
  <link rel="stylesheet" href="assets/css/story.css">
  <link rel="stylesheet" href="assets/css/video.css">
</head>
<body>
  <!-- 顶部导航栏由 assets/js/nav.js 动态注入 -->

  <section class="page-hero">
    <div class="no">Gallery</div>
    <h1><span class="gold-text">照片 · 视频</span></h1>
    <p>照片和视频都在这里，选好文件自动分流</p>
  </section>

  <section class="section">
    <div class="container">
      <!-- 上传区:实名认证过的同学 / 管理员 / 服主可见 -->
      <div id="g-upload" class="g-up" hidden>
        <input type="text" id="g-title" maxlength="40" placeholder="给照片起个名字（如：体育节合影）">
        <select id="g-level" class="g-sel" title="上传画质：只压不小，档位越小传得越快">
          <option value="orig">原始（不压缩）</option>
          <option value="xl">大 · 2560px</option>
          <option value="md" selected>中 · 1920px</option>
          <option value="sm">小 · 1280px</option>
          <option value="xs">极小 · 960px</option>
        </select>
        <label class="g-pick">
          <input type="file" id="g-files" accept="image/*,video/*" multiple>选择照片 / 视频
        </label>
        <button type="button" id="g-send" class="g-btn">上传</button>
        <span id="g-hint" class="g-hint"></span>
        <span id="g-msg" class="g-hint g-err"></span>
        <div id="g-prog" class="g-prog" hidden>
          <i id="g-prog-bar"></i>
          <span id="g-prog-txt"></span>
        </div>
      </div>

      <!-- 图库网格:缩略图 + 名字 + 下载原图按钮,脚本从 /api/gallery 拉 -->
      <div id="gallery-grid" class="gallery-grid">
        <p class="glass gallery-empty">正在读取图库…</p>
      </div>
    </div>
  </section>

  <!-- ========== 视频:卡片流 + 发布框(由 video.js / story.js 接管) ========== -->
  <section class="section" id="video">
    <div class="container">
      <div class="media-head">
        <h2>视频</h2>
        <p>点开一块屏幕，全班一起看。视频和上面的照片共用一个上传框。</p>
      </div>
      <div class="story-wrap">

        <!-- 发布框:默认藏着,选中视频后才由页面脚本亮出来 -->
        <div class="v-up" id="video-upload" hidden>
          <div class="v-up-head">
            <span class="v-up-title">发视频</span>
            <span class="v-up-hint">MP4 / WebM / MOV，发布前会在本地压一遍再传</span>
          </div>

          <div class="v-drop" id="v-drop">
            <b>＋ 选一个视频</b>
            <span>封面会自动从画面里截一张；手机拍的片子会先压缩，省流量也省时间</span>
            <input type="file" id="v-file" accept="video/*">
          </div>

          <video class="v-preview" id="v-preview" controls muted playsinline hidden></video>
          <div class="v-meta-row" id="v-meta-row"></div>

          <div class="v-level" id="v-level" hidden>
            <span class="v-level-lb">上传画质</span>
            <div class="v-level-row" id="v-level-row"></div>
            <p class="v-level-note" id="v-level-note"></p>
          </div>

          <label class="field">
            <span>标题</span>
            <input id="v-title" maxlength="40" placeholder="给这个视频起个标题（如：体育节接力决赛）">
          </label>

          <label class="field">
            <span>说点什么（可不写）</span>
            <textarea id="v-body" rows="3" maxlength="2000" placeholder="这个片子的来龙去脉，写两句就够了。"></textarea>
          </label>

          <div class="vis-pick" id="v-vis" role="group" aria-label="谁可以看">
            <span class="vis-lb">谁可以看</span>
            <button type="button" class="vis-opt active" data-vis="public">全部可见</button>
            <button type="button" class="vis-opt" data-vis="class">仅本班可见</button>
          </div>

          <div class="v-progress" id="v-progress" hidden><i></i></div>

          <div class="composer-foot">
            <p class="form-msg" id="v-msg"></p>
            <button class="submit-btn" type="button" id="v-submit">发布视频</button>
          </div>
        </div>

        <div class="story-list card-grid" id="story-list"></div>

        <div class="pager" id="pager" hidden>
          <button type="button" id="prev-btn">‹ 更新的</button>
          <span id="page-info"></span>
          <button type="button" id="next-btn">更早的 ›</button>
        </div>

      </div>
    </div>
  </section>

  <!-- 灯箱:点缩略图放大原图,下方给下载按钮 -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <span class="close" id="lightbox-close" role="button" tabindex="0">×</span>
    <img id="lightbox-img" alt="">
    <div class="lb-bar">
      <span id="lightbox-caption" class="lightbox-caption"></span>
      <!-- 档位由脚本按这张图的上传画质填充:只给「上传档位及其以下」 -->
      <select id="lightbox-level" class="g-sel" title="下载画质：只能选上传档位及其以下"></select>
      <button id="lightbox-dl" class="lb-dl" type="button">保存</button>
    </div>
  </div>

  <script>
    // 照片 + 视频合并页:视频卡片流由 story.js 的 videos 模式渲染
    window.CLASS103_BOARD = { mode: "videos" };
  </script>
  <script src="assets/js/nav.js"></script>
  <script>
    // 板块门禁:未注册 / 未实名的同学不能浏览照片和视频。
    // ready 可能还是 null(nav.js 没跑到 refresh),主动调一下兜底
    (function () {
      var A = window.C103Auth;
      var r = A && (A.ready || A.refresh());
      (r || Promise.resolve()).then(function () {
        if (!A.canViewSections()) A.sectionGate("照片·视频");
      });
    })();
  </script>
  <script>
    // 班级图库:从 /api/gallery 拉列表,缩略图铺成网格,点开看大图、下载原图。
    // 上传:实名认证过的同学(30MB 额度)、管理员、服主;自己的图能删,管理员/服主能删所有。
    document.addEventListener("DOMContentLoaded", () => {
      const esc = (s) =>
        String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );
      // 缩略图一直在 KV;原图可能已经搬去 B2 —— 但不管存哪,
      // 前端统一用同一条地址,由 Function 判断是去 KV 取还是签名去 B2 取
      const thumb = (k) => "api/gallery/img/" + encodeURIComponent(k);
      const full = (k) => "api/gallery/img/" + encodeURIComponent(k);

      const grid = document.getElementById("gallery-grid");
      const upBox = document.getElementById("g-upload");
      const gTitle = document.getElementById("g-title");
      const gLevel = document.getElementById("g-level");
      const gFiles = document.getElementById("g-files");
      const gSend = document.getElementById("g-send");
      const gHint = document.getElementById("g-hint");
      const gMsg = document.getElementById("g-msg");
      const gProg = document.getElementById("g-prog");
      const gProgBar = document.getElementById("g-prog-bar");
      const gProgTxt = document.getElementById("g-prog-txt");
      const lightbox = document.getElementById("lightbox");
      const lbImg = document.getElementById("lightbox-img");
      const lbCaption = document.getElementById("lightbox-caption");
      const lbDl = document.getElementById("lightbox-dl");
      const lbLevel = document.getElementById("lightbox-level");
      const lbClose = document.getElementById("lightbox-close");

      const A = window.C103Auth || null; // 登录态

      function fmtMB(b) {
        const mb = b / (1024 * 1024);
        return mb >= 10 ? Math.round(mb) + "MB" : mb.toFixed(1) + "MB";
      }

      // 能不能传:实名 / 管理员 / 服主
      function canUpload(me) {
        return !!me && (me.role === "owner" || me.role === "admin" || me.verified === 1);
      }

      function closeLightbox() {
        lightbox.classList.remove("show");
        lightbox.setAttribute("aria-hidden", "true");
      }
      lbClose.addEventListener("click", closeLightbox);
      lbClose.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); closeLightbox(); }
      });
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });

      // 灯箱当前这张:保存按钮按下面选中的画质导出
      let lbItem = null;

      function openLightbox(item) {
        lbItem = item;
        lbImg.src = full(item.full);
        lbImg.alt = item.title;
        lbCaption.textContent = item.title + (item.by ? "　上传：" + item.by : "");
        // 灯箱的下载档位跟着这张图的上传画质走:只给「上传档位及其以下」
        lbLevel.innerHTML = levelOptions(item.level);
        // 灯箱里也给删除:自己的图能删,管理员/服主能删所有
        lightbox.classList.add("show");
        lightbox.setAttribute("aria-hidden", "false");
        bindLightboxDelete(item, true);
      }

      // 灯箱「保存」:按选中的画质下载(原始 / 大 / 中 / 小 / 极小)
      lbDl.addEventListener("click", () => {
        if (lbItem) downloadAt(lbItem, lbLevel.value, lbDl);
      });

      // 渲染网格。me 是当前登录的人,quota 是额度信息
      function render(items, me, quota) {
        if (!items || !items.length) {
          grid.innerHTML = '<p class="glass gallery-empty">图库还是空的，实名认证后就可以传照片啦。</p>';
          return;
        }
        // 能不能删别人的图:管理员 / 服主
        const canDelAll = me && (me.role === "owner" || me.role === "admin");
        grid.innerHTML = items
          .map(
            (it) => {
              const own = !!me && it.by_id === me.id;
              const showDel = canDelAll || own;
              return `
            <figure class="gal-item" data-id="${it.id}">
              <img src="${esc(thumb(it.thumb))}" alt="${esc(it.title)}" loading="lazy">
              <figcaption>
                <span class="gal-title">${esc(it.title)}</span>
                <span class="gal-author">上传：${esc(it.by || "已注销")}</span>
                <span class="gal-actions">
                  <select class="gal-sel" title="下载画质：只能选上传档位及其以下">
                    ${levelOptions(it.level)}
                  </select>
                  <button type="button" class="gal-dl" title="按所选画质保存到本地">保存</button>
                  ${showDel ? '<button type="button" class="gal-del" data-id="' + it.id + '" title="删除">删除</button>' : ""}
                </span>
              </figcaption>
            </figure>`;
            }
          )
          .join("");

        // 点卡片看大图;下拉/保存/删除按钮单独处理,不触发看大图
        grid.querySelectorAll(".gal-item").forEach((item) => {
          const idx = () => Array.prototype.indexOf.call(grid.children, item);
          item.addEventListener("click", (e) => {
            if (e.target.closest(".gal-sel") || e.target.closest(".gal-dl") || e.target.closest(".gal-del")) return;
            openLightbox(items[idx()]);
          });
          const sel = item.querySelector(".gal-sel");
          const dlBtn = item.querySelector(".gal-dl");
          if (dlBtn) dlBtn.addEventListener("click", () => downloadAt(items[idx()], sel.value, dlBtn));
          const delBtn = item.querySelector(".gal-del");
          if (delBtn) {
            delBtn.addEventListener("click", () => doDelete(parseInt(delBtn.dataset.id, 10)));
          }
        });
      }

      // 删除一张图
      async function doDelete(id) {
        if (!confirm("确定删除这张照片吗？原图会一起删掉。")) return;
        try {
          const res = await fetch("api/gallery/" + id, { method: "DELETE", credentials: "same-origin" });
          const d = await res.json().catch(() => null);
          if (d && d.ok) {
            load(0);
          } else {
            alert((d && d.error) || "删除失败，重试一下");
          }
        } catch (e) {
          alert("删除失败，检查网络再试");
        }
      }

      const bindLightboxDelete = (item, shown) => { /* 灯箱删除由网格按钮负责,这里留占位 */ };

      // 上传画质档位:null = 原始原样上传(不压缩),其余给 maxEdge + quality。
      // 档位越小,上传越快、同学下载也越快(跨境带宽有限,少传几个 MB 差别很大)。
      const LEVELS = {
        orig: null,
        xl: { maxEdge: 2560, quality: 0.9 },
        md: { maxEdge: 1920, quality: 0.85 },
        sm: { maxEdge: 1280, quality: 0.8 },
        xs: { maxEdge: 960, quality: 0.72 },
      };

      // 档位从大到小排。图片存进去时已经按上传档位压过一次了,
      // 下载只能给「上传档位及其以下」——再给更大的档位没意义,压缩只会变小。
      const LEVEL_ORDER = ["orig", "xl", "md", "sm", "xs"];
      const LEVEL_LABEL = {
        orig: "原始（不压缩）",
        xl: "大 · 2560px",
        md: "中 · 1920px",
        sm: "小 · 1280px",
        xs: "极小 · 960px",
      };

      // 按某张图的上传档位,生成可选下载档位(从它自己一直往小排)。
      // 老数据没有 level 字段时按 orig 处理(全档位可选,行为跟以前一致)。
      function levelOptions(itemLevel) {
        const i = Math.max(0, LEVEL_ORDER.indexOf(itemLevel || "orig"));
        return LEVEL_ORDER.slice(i)
          .map((k) => '<option value="' + k + '">' + LEVEL_LABEL[k] + "</option>")
          .join("");
      }

      // 缩略图:从「已经压好的原图」再压一张小的,这样不必把 20MB 的原文件解码两遍
      async function compressThumb(source) {
        const blob = await window.C103Image.compress(source, { maxEdge: 1200, targetBytes: 400 * 1024 });
        return new File([blob], "thumb.jpg", { type: blob.type || "image/jpeg" });
      }

      // 下载:按选中档位导出。选中「这张图的上传档位」= 直接存 KV 里那张(不过 canvas,不用等);
      // 选更小的档位 = 先把这张图拉下来,再用跟上传一模一样的那套压缩逻辑再缩一遍另存为 JPG。
      async function downloadAt(item, levelKey, btn) {
        const itemLevel = item.level || "orig";
        const direct = levelKey === itemLevel; // 存的本来就是这一档,直接下
        const lv = LEVELS[levelKey];
        const name = (item.title || "photo") + ".jpg";
        const oldText = btn ? btn.textContent : "";
        if (btn) { btn.disabled = true; btn.textContent = direct ? "下载中…" : "压缩中…"; }
        try {
          let href = full(item.full);
          let revoke = null;
          if (!direct && lv) {
            const res = await fetch(href, { credentials: "same-origin" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const blob = await res.blob();
            const src = new File([blob], "photo.jpg", { type: blob.type || "image/jpeg" });
            const out = await window.C103Image.compress(src, {
              maxEdge: lv.maxEdge,
              quality: lv.quality,
              targetBytes: 0, // 只压这一次,不按体积反复压
            });
            href = URL.createObjectURL(out);
            revoke = href;
          }
          const a = document.createElement("a");
          a.href = href;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          if (revoke) setTimeout(() => URL.revokeObjectURL(revoke), 20000);
        } catch (e) {
          alert("下载失败：" + (e && e.message ? e.message : "检查网络再试一次"));
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = oldText; }
        }
      }

      // 用 XHR 上传:能拿到真实的上传进度(百分比),还能设置超时。
      // fetch 没有上传进度,大文件卡在那儿用户只能干等然后等来一个裸的 "Failed to fetch"。
      function xhrUpload(form) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "api/gallery", true);
          xhr.responseType = "json";
          xhr.timeout = 90000; // 90 秒,超了就报友好提示而不是一直转
          xhr.upload.addEventListener("progress", (e) => {
            if (!e.lengthComputable) return;
            const pct = Math.round((e.loaded / e.total) * 100);
            gProgBar.style.width = pct + "%";
            gProgTxt.textContent = "上传 " + pct + "%";
          });
          xhr.onload = () => {
            const d = xhr.response || null;
            if (xhr.status === 401 || xhr.status === 403) {
              gProg.hidden = true;
              reject(new Error("登录失效或没权限：请先登录实名账号，再重新上传"));
              return;
            }
            if (xhr.status >= 200 && xhr.status < 300 && d && d.ok) {
              gProg.hidden = true;
              resolve(d);
              return;
            }
            gProg.hidden = true;
            reject(new Error((d && d.error) || "上传失败(HTTP " + xhr.status + ")，再试一次"));
          };
          xhr.onerror = () => {
            gProg.hidden = true;
            reject(new Error("网络出错，上传中断，请检查网络再试"));
          };
          xhr.ontimeout = () => {
            gProg.hidden = true;
            reject(new Error("上传超时(90 秒)。照片太大或网络太慢，试着传小一点的图"));
          };
          xhr.send(form);
        });
      }

      // 选完文件立刻给个反馈,别让人以为卡了
      gFiles.addEventListener("change", () => {
        const list = Array.from(gFiles.files || []);
        const vids = list.filter(
          (f) => /^video\//.test(f.type) || /\.(mp4|webm|mov|m4v|avi|mkv)$/i.test(f.name)
        ).length;
        const pics = list.length - vids;
        if (!list.length) { gHint.textContent = ""; return; }
        const bits = [];
        if (pics) bits.push(pics + " 张照片");
        if (vids) bits.push(vids + " 个视频");
        gHint.textContent = "已选 " + bits.join(" + ") + "，点「上传」后自动分流。" + (pics ? levelTip() : "");
      });

      // 当前档位的说明文字(提示大概会压到多大)
      function levelTip() {
        const lv = LEVELS[gLevel.value];
        if (!lv) return "当前档位：原始不压缩。";
        return "当前档位：最长边 " + lv.maxEdge + "px，会自动压小后再传。";
      }

      // 换档位时立刻说明会怎么压
      gLevel.addEventListener("change", () => {
        gHint.textContent = levelTip();
      });

      // ---------- 视频:统一上传框选中的视频交给 video.js 的发布流程 ----------
      const videoQueue = [];
      const vBox = document.getElementById("video-upload");
      const vFile = document.getElementById("v-file");
      const vTitle = document.getElementById("v-title");

      function pumpVideo() {
        const f = videoQueue.shift();
        if (!f || !vFile) return;
        // 把文件塞进视频发布框自己的 input,再触发 change,
        // 这样截封面、自动选画质、压缩、上传全都复用 video.js 现成的那一套
        const dt = new DataTransfer();
        dt.items.add(f);
        vFile.files = dt.files;
        vFile.dispatchEvent(new Event("change", { bubbles: true }));
        if (vTitle && !vTitle.value.trim()) {
          vTitle.value = f.name.replace(/\.[^.]+$/, "").slice(0, 40);
        }
        if (vBox) {
          vBox.hidden = false;
          vBox.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        if (gHint) {
          gHint.textContent = videoQueue.length
            ? "视频还有 " + videoQueue.length + " 个在排队，发布完会自动继续下一个。"
            : "视频已载入，填好标题点「发布视频」。";
        }
      }

      // video.js 发布成功后的回调:队列里还有就继续下一个,全部发完重载一次刷新列表
      window.C103VideoOnPublished = () => {
        if (videoQueue.length) setTimeout(pumpVideo, 500);
        else location.reload();
      };

      // 上传按钮:无条件绑定(权限由服务端管,没权限的请求会被 401 挡下)。
      // 之前只在 load() 成功且 canUpload 为真时才绑,一旦那步没走到,
      // 点「上传」就完全没反应 —— 这正是「选了图点了却无响应」的根因。
      if (!upBox.__bound) {
        upBox.__bound = true;
        gSend.addEventListener("click", async () => {
          const picked = Array.from(gFiles.files || []).filter((f) => f.size > 0);
          if (!picked.length) { gMsg.textContent = "先选几张照片或视频"; return; }

          // 按类型分流:照片走下面的批量压缩上传,视频交给 video.js 的发布流程
          const isVideo = (f) =>
            /^video\//.test(f.type) || /\.(mp4|webm|mov|m4v|avi|mkv)$/i.test(f.name);
          const photos = picked.filter((f) => !isVideo(f));
          const clips = picked.filter(isVideo);

          // 先传照片(要照片名),再逐个处理视频(标题在发布框里填)
          if (photos.length) {
            const t = gTitle.value.trim();
            if (!t) { gMsg.textContent = "先给照片起个名字"; return; }

            gSend.disabled = true;
            gMsg.textContent = "";
            gProg.hidden = false;
            gProgBar.style.width = "0%";
            try {
              const level = LEVELS[gLevel.value]; // null = 不压缩
              for (let i = 0; i < photos.length; i++) {
                const file = photos[i];
                const n = i + 1;
                gProgTxt.textContent = "准备第 " + n + "/" + photos.length + " 张…";
                // 压缩大图是重活,先让浏览器把提示画出来,免得看着像卡死
                gHint.textContent = level
                  ? "正在压缩第 " + n + "/" + photos.length + " 张…"
                  : "正在读取第 " + n + "/" + photos.length + " 张…";
                await new Promise((r) => setTimeout(r, 30));

                // 原图档:原样上传;其余档:先压到选定画质,再拿压好的图做缩略图
                let fullBlob = file;
                let fullName = file.name;
                if (level) {
                  fullBlob = await window.C103Image.compress(file, {
                    maxEdge: level.maxEdge,
                    quality: level.quality,
                    targetBytes: 0, // 只压这一次,不再按体积反复压
                  });
                  fullName = "photo.jpg";
                }

                const form = new FormData();
                form.append("title", t);
                // 把上传档位一起报给服务端存下来,下载时只给「这一档及其以下」
                form.append("level", gLevel.value);
                form.append("full", fullBlob, fullName);
                form.append("thumb", await compressThumb(fullBlob));
                gHint.textContent =
                  "正在上传第 " + n + "/" + photos.length + " 张（" +
                  fmtMB(fullBlob.size) + (level ? "，已从 " + fmtMB(file.size) + " 压小" : "") + "）…";
                await xhrUpload(form);
              }
              gProg.hidden = true;
              gHint.textContent = "照片传完了，正在刷新图库…";
              gMsg.textContent = "";
              load(0); // 传完重拉,额度也跟着刷新
            } catch (e) {
              gMsg.textContent = e.message || "上传中断，检查网络再试";
              return; // 照片都没传成,就别接着处理视频了
            } finally {
              gProg.hidden = true;
              gSend.disabled = false;
            }
          }

          gFiles.value = "";
          if (clips.length) {
            videoQueue.push(...clips);
            pumpVideo();
          }
        });
      }

      const load = async (retries) => {
        try {
          const res = await fetch("api/gallery", { credentials: "same-origin", cache: "no-store" });
          if (!res.ok) throw new Error("http " + res.status);
          const d = await res.json().catch(() => null);
          if (!d || !d.ok) throw new Error("bad payload");
          render(d.items || [], d.me, d.quota);

          // 上传区:实名 / 管理员 / 服主才有
          const meCan = canUpload(d.me);
          upBox.hidden = false;
          if (!meCan) {
            upBox.hidden = true;
            return;
          }
          // 上传按钮已在页面脚本顶层无条件绑定,这里只负责显示/隐藏上传框
          // 额度文案
          if (d.quota && d.quota.unlimited) {
            gHint.textContent = "管理员 / 服主，不限额度。";
          } else if (d.quota) {
            const left = Math.max(0, d.quota.limit - d.quota.used);
            gHint.textContent = "实名额度 " + fmtMB(d.quota.used) + " / " + fmtMB(d.quota.limit) + "，还剩 " + fmtMB(left) + "";
          } else {
            gHint.textContent = "";
          }
        } catch (e) {
          if (retries > 0) return setTimeout(() => load(retries - 1), 600);
          grid.innerHTML =
            '<p class="glass gallery-empty">图库没读上来，检查一下网络再刷新。</p>';
        }
      };
      load(2);

      // 从导航的「＋ → 发视频」跳过来时,上传框亮出来后滚到它
      // (老链接 videos.html?post=1 也会重定向到这里,顺便认一下 post)
      const jump = new URLSearchParams(location.search);
      if (jump.get("video") || jump.get("post")) {
        let n = 0;
        const t = setInterval(() => {
          if (!upBox.hidden) {
            upBox.scrollIntoView({ behavior: "smooth", block: "start" });
            clearInterval(t);
          } else if (++n > 25) clearInterval(t);
        }, 200);
      }
    });
  </script>
  <script src="assets/js/story.js"></script>
  <script src="assets/js/video.js"></script>
</body>
</html>
